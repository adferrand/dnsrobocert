[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dnsrobocert"
version = "3.28.0"
description = "A tool to manage your DNS-challenged TLS certificates"
license = "MIT"
keywords = ["dnsrobocert"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Utilities",
]
authors = [{ name = "Adrien Ferrand", email = "ferrand.ad@gmail.com" }]
readme = "README.rst"

requires-python = ">=3.11"
dependencies = [
    "acme>=4",
    "certbot>=4",
    "dns-lexicon[full]>=3.14.0",
    "cryptography>=39",
    "dnspython>=2.1.0",
    "jsonschema>=3",
    "pyyaml>=5",
    "schedule>=1",
    "coloredlogs>=14",
    "colorama>=0",
    "tldextract>=3",
]

[project.urls]
repository = "https://github.com/adferrand/dnsrobocert"
homepage = "https://adferrand.github.io/dnsrobocert/"

[project.scripts]
dnsrobocert = "dnsrobocert.core.main:main"

[dependency-groups]
dev = [
    "mypy",
    "packaging",
    "pytest",
    "pytest-cov",
    "pytest-sugar",
    "requests",
    "urllib3",
    "ruff",
    "types-PyYAML",
    "types-requests",
    "towncrier>=26.9.0",
]
doc = ["sphinx", "piccolo-theme", "toml"]

[tool.pytest.ini_options]
junit_family = "xunit2"
addopts = "-p no:legacypath"

[tool.mypy]
show_error_codes = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true

[tool.tox]
envlist = ["cover", "lint", "mypy"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
with_dev = true
commands = [
    [
        "pytest",
        "test",
        "--doctest-modules",
        "--junitxml=junit/test-results.xml",
    ],
]

[tool.tox.env.cover]
commands = [
    [
        "pytest",
        "test",
        "--doctest-modules",
        "--junitxml=junit/test-results.xml",
        "--cov=dnsrobocert",
        "--cov-report=term-missing",
        "--cov-report=xml",
        "--cov-fail-under=85",
    ],
]

[tool.tox.env.lint]
commands = [["ruff", "check", "src", "test"]]

[tool.tox.env.mypy]
commands = [["mypy", "src"]]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # Line length is handled by `ruff format`.

[tool.towncrier]
directory = "newsfragments"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} - {project_date}"
underlines = ["", "", ""]
template = "newsfragments/_template.md.j2"
issue_format = "([#{issue}](https://github.com/adferrand/dnsrobocert/pull/{issue}))"
# Keep the section headings of the historical changelog.
type = [
    { directory = "added", name = "Added", showcontent = true },
    { directory = "changed", name = "Modified", showcontent = true },
    { directory = "fixed", name = "Fixed", showcontent = true },
    { directory = "security", name = "Security", showcontent = true },
    { directory = "removed", name = "Removed", showcontent = true },
]
