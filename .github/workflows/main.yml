name: main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.15"]
        toxenv: [py3]
        exclude:
          - os: ubuntu-latest
            python: "3.15"
            toxenv: py3
        include:
          - os: ubuntu-latest
            python: "3.15"
            toxenv: cover
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Configure Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run tox
        run: uvx --with tox-uv tox -e ${{ matrix.toxenv }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results-${{ matrix.os }}-${{ matrix.python }}
          path: |
            junit/*.xml
      - name: Publish coverage
        uses: codecov/codecov-action@v7
        if: ${{ matrix.toxenv == 'cover' }}
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build docker image
        run: docker build --tag adferrand/dnsrobocert:temp .
      - name: Run docker unit tests
        run: |
          mkdir -p ./bin
          curl -fsSL https://goss.rocks/install | GOSS_DST=./bin sh
          GOSS_PATH=./bin/goss GOSS_SLEEP=5 GOSS_FILES_PATH=./test/goss ./bin/dgoss run adferrand/dnsrobocert:temp
  quality:
    strategy:
      matrix:
        toxenv: [lint, mypy]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Check that uv.lock is up to date
        run: uv lock --check
      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run tox
        run: uvx --with tox-uv tox -e ${{ matrix.toxenv }}
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Build the documentation, failing on any warning
        run: uv run --group doc sphinx-build -W --keep-going -b html ./docs ./docs/_build
  changelog:
    # A pull request that changes the behavior for users needs a news fragment (see newsfragments/README.md).
    # Add the `skip-changelog` label to bypass this check (tests, CI, internal changes...).
    if: >-
      github.event_name == 'pull_request'
      && github.actor != 'dependabot[bot]'
      && !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Check that a news fragment is provided
        run: uv run towncrier check --compare-with origin/${{ github.base_ref }}
  event-file:
    runs-on: ubuntu-latest
    steps:
      - name: Upload event file
        uses: actions/upload-artifact@v7
        with:
          name: event-file
          path: ${{ github.event_path }}
